project_id = "your-food-admin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "yourfoodadmin://"
additional_redirect_urls = ["yourfoodadmin://**"]
enable_signup = false

[realtime]
enabled = true

[functions.admin-users]
verify_jwt = true
